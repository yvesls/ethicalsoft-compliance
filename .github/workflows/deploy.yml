name: Build e Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Build Angular ─────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Angular
        working-directory: ./frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build -- --configuration=production

      # ── 3. Build Spring Boot ──────────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Spring Boot
        working-directory: ./backend
        run: mvn clean package -DskipTests

      # ── NOVO PASSO: Ligar ao Tailscale ────────────────────────
      - name: Ligar ao Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # ── 4. Enviar artefatos para o servidor ───────────────────
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Enviar build do Angular
        run: |
          rsync -az --delete \
            frontend/dist/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/tcc/frontend/dist/

      - name: Enviar JAR do Spring Boot
        run: |
          rm -f backend/target/*-plain.jar
          scp backend/target/*.jar \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/tcc/backend/app.jar

      # ── 5. Disparar deploy via webhook ────────────────────────
      - name: Disparar webhook de deploy
        run: |
          PAYLOAD='{}'
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 \
            -hmac "${{ secrets.WEBHOOK_SECRET }}" | awk '{print $2}')

          curl -f -X POST http://${{ secrets.SERVER_HOST }}:9000/hooks/deploy \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            -d "$PAYLOAD"
