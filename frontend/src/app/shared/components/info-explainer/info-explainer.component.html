<div class="info-explainer-container">
  <button
    type="button"
    class="info-icon"
    (click)="togglePopover()"
    [attr.aria-label]="'common.more_info' | translate"
    role="button"
    tabindex="0"
    [attr.title]="'common.more_info' | translate"
  >
    <img
      src="assets/icons/circle-info-solid-full.svg"
      [attr.alt]="'common.info_icon_alt' | translate"
      class="icon-image"
    />
  </button>

  @if (isOpen()) {
    <div
      class="popover"
      [class.position-left]="popoverPosition() === 'left'"
      [ngStyle]="popoverStyle()"
      role="tooltip"
    >
      @if (entry(); as e) {
        <h4 class="popover-title">{{ e.title }}</h4>
        <p class="popover-desc">{{ e.description }}</p>
        @if (e.items && e.items.length) {
          <ul class="popover-items">
            @for (item of e.items; track item) {
              <li>{{ item }}</li>
            }
          </ul>
        }
      } @else {
        <p class="popover-desc">{{ 'shared_info_explainer_unavailable' | translate }}</p>
      }
    </div>
  }
</div>
