<div class="card small-card">
	<h1>{{ 'auth.register.heading' | translate }}</h1>
	<p>{{ 'auth.register.subtitle' | translate }}</p>

	<form class="row" (ngSubmit)="register()" [formGroup]="form">
		<app-input
			formControlName="firstName"
			[label]="'auth.register.first_name' | translate"
			type="text"
			id="firstName"
			[placeholder]="'auth.register.first_name_placeholder' | translate"
			inputClasses="form-control"
			labelClasses="form-label"
			[validationMessages]="{
				required: ('auth.validation.first_name_required' | translate),
			}"
			[control]="form.get('firstName')"
		>
		</app-input>

		<app-input
			formControlName="lastName"
			[label]="'auth.register.last_name' | translate"
			type="text"
			id="lastName"
			[placeholder]="'auth.register.last_name_placeholder' | translate"
			inputClasses="form-control"
			labelClasses="form-label"
			[validationMessages]="{
				required: ('auth.validation.last_name_required' | translate),
			}"
			[control]="form.get('lastName')"
		>
		</app-input>

		<app-input
			formControlName="email"
			[label]="'auth.register.email' | translate"
			type="email"
			id="email"
			[placeholder]="'auth.register.email_placeholder' | translate"
			inputClasses="form-control"
			labelClasses="form-label"
			[validationMessages]="{
				required: ('auth.validation.email_required' | translate),
				email: ('auth.validation.email_invalid' | translate),
			}"
			[control]="form.get('email')"
		>
		</app-input>

		<app-input
			formControlName="password"
			[label]="'auth.register.password' | translate"
			type="password"
			id="password"
			[placeholder]="'auth.register.password_placeholder' | translate"
			inputClasses="form-control"
			labelClasses="form-label"
			[validationMessages]="{
				required: ('auth.validation.password_required' | translate),
			}"
			[control]="form.get('password')"
		>
		</app-input>

		<app-input
			formControlName="confirmPassword"
			[label]="'auth.register.confirm_password' | translate"
			type="password"
			id="confirmPassword"
			[placeholder]="'auth.register.confirm_password_placeholder' | translate"
			inputClasses="form-control"
			labelClasses="form-label"
			[validationMessages]="{
				required: ('auth.validation.confirm_password_required' | translate),
			}"
			[control]="form.get('confirmPassword')"
		>
		</app-input>

		<div class="col-12 options">
			<label class="terms-label">
				<input type="checkbox" formControlName="acceptedTerms" />
				{{ 'auth.register.terms_prefix' | translate }}
				<button class="link" type="button" (click)="openTermsAndPolicies($event)">{{ 'auth.register.terms_link' | translate }}</button>
				{{ 'auth.register.terms_suffix' | translate }}
			</label>
		</div>

		<div class="col-12">
			<button class="btn btn-primary col-12" type="submit" [disabled]="form.invalid">{{ 'auth.register.submit' | translate }}</button>
		</div>
	</form>

	<p class="login">{{ 'auth.register.has_account' | translate }} <button class="link" type="button" (click)="goToLogin()">{{ 'auth.register.login_link' | translate }}</button></p>
</div>
