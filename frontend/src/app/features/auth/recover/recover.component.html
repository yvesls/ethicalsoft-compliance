<div class="card small-card">
	<h1>{{ 'auth.recovery.heading' | translate }}</h1>
	<p>{{ 'auth.recovery.subtitle' | translate }}</p>

	<form class="row" (ngSubmit)="sendRecoveryEmail()" [formGroup]="form">
		<app-input
			formControlName="email"
			[label]="'auth.login.email' | translate"
			type="email"
			id="email"
			[placeholder]="'auth.recovery.email_placeholder' | translate"
			[required]="true"
			inputClasses="form-control"
			labelClasses="form-label"
			[validationMessages]="{
				required: ('auth.validation.email_required' | translate),
				email: ('auth.validation.email_invalid' | translate),
			}"
			[control]="form.get('email')"
		>
		</app-input>

		<div class="col-12">
			<button class="btn btn-primary col-12 mt-4" type="submit" [disabled]="form.invalid">
				{{ 'auth.recovery.send_email' | translate }}
			</button>
			<p class="text-start mt-2">{{ 'auth.recovery.code_expiry' | translate }}</p>
		</div>
	</form>
</div>
