<div class="card small-card">
	<h1>{{ 'auth.login.title' | translate }}</h1>
	<p>{{ 'auth.login.subtitle' | translate }}</p>

	<form class="row" (ngSubmit)="login()" [formGroup]="form">
		<app-input
			formControlName="username"
			[label]="'auth.login.email' | translate"
			type="email"
			id="email"
			[placeholder]="'auth.login.email_placeholder' | translate"
			inputClasses="form-control"
			labelClasses="form-label"
			[validationMessages]="{
				required: ('auth.validation.email_required' | translate),
				email: ('auth.validation.email_invalid' | translate)
			}"
			[control]="form.get('username')"
		>
		</app-input>

		<app-input
			formControlName="password"
			[label]="'auth.login.password' | translate"
			type="password"
			id="password"
			[placeholder]="'auth.login.password_placeholder' | translate"
			inputClasses="form-control"
			labelClasses="form-label"
			[validationMessages]="{
				required: ('auth.validation.password_required' | translate)
			}"
			[control]="form.get('password')"
		>
		</app-input>

		<div class="col-12 options">
			<div class="text-blue font-weight-bold">
				<span class="d-flex justify-content-center">
					<input type="checkbox" formControlName="keepSession" /> {{ 'auth.login.keep_session' | translate }}
				</span>
			</div>
			<button class="link" type="button" (click)="goToRecover()">{{ 'auth.login.forgot_password' | translate }}</button>
		</div>

		<div class="col-12">
			<button class="btn btn-primary col-12" type="submit" [disabled]="form.invalid">{{ 'auth.login.submit' | translate }}</button>
		</div>
	</form>
	<p class="register">
		{{ 'auth.login.analyst_intro' | translate }}
		<button class="link" type="button" (click)="goToRegister()">{{ 'auth.login.register_link' | translate }}</button>
	</p>
</div>
