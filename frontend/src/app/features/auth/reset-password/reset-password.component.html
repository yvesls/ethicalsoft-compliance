<div class="card small-card">
	<h1>{{ 'auth.reset_password.title' | translate }}</h1>

	<form class="row" [formGroup]="form" (ngSubmit)="reset()">
		<app-input
			formControlName="password"
			[label]="'auth.reset_password.new_password' | translate"
			type="password"
			id="password"
			[placeholder]="'auth.reset_password.new_password_placeholder' | translate"
			[required]="true"
			[validationMessages]="passwordValidationMessages"
			[control]="form.get('password')"
		></app-input>

		<app-input
			formControlName="confirmPassword"
			[label]="'auth.reset_password.confirm_password' | translate"
			type="password"
			id="confirmPassword"
			[placeholder]="'auth.reset_password.confirm_password_placeholder' | translate"
			[required]="true"
			[validationMessages]="confirmPasswordValidationMessages"
			[control]="form.get('confirmPassword')"
		></app-input>

		<div class="col-12">
			<button class="btn btn-primary col-12 mt-4" type="submit" [disabled]="form.invalid">{{ 'auth.reset_password.submit' | translate }}</button>
		</div>
	</form>
</div>
