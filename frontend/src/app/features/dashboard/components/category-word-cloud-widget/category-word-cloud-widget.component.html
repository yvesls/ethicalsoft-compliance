<div class="cwc">
  <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
    <h3 class="cwc__title">{{ 'dashboard.cwc.title' | translate }}</h3>
    <app-info-explainer key="questionnaire_status" />
  </div>

  <div class="cwc__tabs">
    <button
      class="cwc__tab"
      [class.cwc__tab--active]="activeTab === 'GERAL'"
      (click)="selectTab('GERAL')"
    >
      {{ 'dashboard.cwc.general_tab' | translate }}
    </button>
    @for (cat of categoryKeys; track cat) {
      <button
        class="cwc__tab"
        [class.cwc__tab--active]="activeTab === cat"
        (click)="selectTab(cat)"
      >
        {{ domainLabel(cat) }}
      </button>
    }
  </div>

  <p class="cwc__meta">{{ 'dashboard.cwc.justifications_count' | translate: { count: totalJustifications } }}</p>

  @if (chartOptions) {
    <div echarts [options]="chartOptions" class="cwc__chart"></div>
  } @else {
    <div class="cwc__empty">{{ 'dashboard.cwc.no_words' | translate }}</div>
  }
</div>
