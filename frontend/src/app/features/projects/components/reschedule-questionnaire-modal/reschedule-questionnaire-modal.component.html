<div class="modal-header">
  <h2>{{ 'projects.reschedule.title_with_name' | translate: { name: questionnaireName } }}</h2>
</div>

<div class="modal-body">
  <div class="current-period">
    <span class="current-period__label">{{ 'projects.reschedule.current_period' | translate }}</span>
    <span class="current-period__dates">
      {{ formattedCurrentStart }} até {{ formattedCurrentEnd }}
    </span>
  </div>

  <form [formGroup]="form">
    <div class="form-row">
      <div class="form-group">
        <app-input
          [label]="'projects.reschedule.new_start' | translate"
          [required]="true"
          formControlName="newApplicationStartDate"
          [control]="form.get('newApplicationStartDate')"
          type="date"
        ></app-input>
      </div>

      <div class="form-group">
        <app-input
          [label]="'projects.reschedule.new_end' | translate"
          [required]="true"
          formControlName="newApplicationEndDate"
          [control]="form.get('newApplicationEndDate')"
          type="date"
        ></app-input>
      </div>
    </div>

    @if (warningMessage) {
      <div class="warning-message">
        {{ warningMessage }}
      </div>
    }
  </form>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-cancel" (click)="cancel()">
    {{ 'common.cancel' | translate }}
  </button>
  <button
    type="button"
    class="btn btn-primary"
    (click)="confirm()"
    [disabled]="form.invalid"
  >
    {{ 'projects.reschedule.confirm_btn' | translate }}
  </button>
</div>
