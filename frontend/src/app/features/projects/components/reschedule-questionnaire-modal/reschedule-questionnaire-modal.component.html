<div class="modal-header">
  <h2>Reagendar Questionário: {{ questionnaireName }}</h2>
</div>

<div class="modal-body">
  <div class="current-period">
    <span class="current-period__label">Período atual:</span>
    <span class="current-period__dates">
      {{ formattedCurrentStart }} até {{ formattedCurrentEnd }}
    </span>
  </div>

  <form [formGroup]="form">
    <div class="form-row">
      <div class="form-group">
        <app-input
          label="Nova data de início"
          [required]="true"
          formControlName="newApplicationStartDate"
          [control]="form.get('newApplicationStartDate')"
          type="date"
        ></app-input>
      </div>

      <div class="form-group">
        <app-input
          label="Nova data de término"
          [required]="true"
          formControlName="newApplicationEndDate"
          [control]="form.get('newApplicationEndDate')"
          type="date"
        ></app-input>
      </div>
    </div>

    @if (warningMessage) {
      <div class="warning-message">
        {{ warningMessage }}
      </div>
    }
  </form>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-cancel" (click)="cancel()">
    Cancelar
  </button>
  <button
    type="button"
    class="btn btn-primary"
    (click)="confirm()"
    [disabled]="form.invalid"
  >
    Reagendar
  </button>
</div>
