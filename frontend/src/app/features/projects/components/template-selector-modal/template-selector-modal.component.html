<div class="modal-header">
  <h2>{{ 'projects.template_selector.title' | translate }}</h2>
  <button class="close-btn" (click)="close()">×</button>
</div>

<div class="modal-body">
  @if (!isLoading) {
    <div class="template-selector">
    <app-select
      label=""
      [placeholder]="'projects.template_selector.placeholder' | translate"
      [options]="templateOptions"
      [formControl]="templateControl"
    ></app-select>
    </div>
  }

  @if (isLoading) {
    <div class="loading">
      <p>{{ 'projects.template_selector.loading' | translate }}</p>
    </div>
  }
</div>

<div class="modal-actions">
  <button
    type="button"
    class="btn btn-secondary"
    (click)="importFromExternal()"
  >
    {{ 'projects.template_selector.import_external' | translate }}
  </button>

  <button
    type="button"
    class="btn btn-primary"
    [disabled]="!templateControl.value"
    (click)="confirm()"
  >
    {{ 'common.confirm' | translate }}
  </button>
</div>
