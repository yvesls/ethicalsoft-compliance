<div class="page-container">
  <app-filter-bar
    [formGroup]="filterForm"
    (filterSubmit)="onSearch()"
    gridTemplateColumns="2fr 1.5fr 1.5fr 1fr auto" >

    <app-select
      filters formControlName="type"
      [label]="'projects.list.fields.type' | translate"
      placeholder="projects.list.filters.type_placeholder"
      [control]="filterForm.get('type')"
      [options]="projectTypeOptions"
      [allowClear]="true">
    </app-select>

    <app-select
      filters formControlName="status"
      [label]="'common.status' | translate"
      placeholder="projects.list.filters.status_placeholder"
      [control]="filterForm.get('status')"
      [options]="projectStatusOptions"
      [allowClear]="true">
    </app-select>

    <app-input
      filters formControlName="name"
      [label]="'projects.list.fields.name' | translate"
      type="text"
      [placeholder]="'projects.list.filters.name_placeholder' | translate"
      [control]="filterForm.get('name')"
    ></app-input>

    <app-input
      filters formControlName="code"
      [label]="'projects.list.fields.code' | translate"
      type="text"
      [placeholder]="'projects.list.filters.code_placeholder' | translate"
      [control]="filterForm.get('code')"
    ></app-input>

    <button filters type="submit" class="btn btn-primary btn-icon">
        <img src="assets/icons/search.svg" [attr.alt]="'common.search' | translate" />
    </button>

    <div actions>
      @if (isAdmin()) {
        <button type="button" class="btn btn-secundary" (click)="goToCreateProject()">
          {{ 'projects.create_new' | translate }}
        </button>
      }
    </div>
  </app-filter-bar>

  <app-list
    [status]="status()"
    [error]="error()"
    noItemsMessage="projects.empty"
    [itemCount]="projects().length" >

    <div listBody>
  @for (project of projects(); track trackByProjectId($index, project)) {
        <app-list-item
          [item]="project"
          [navigateTo]="['/projects', project.id]">
        </app-list-item>
      }
    </div>

    <div listFooter>
      <app-pagination
         [currentPage]="pagination().currentPage"
         [totalItems]="pagination().totalItems"
         [pageSize]="pagination().pageSize"
         (pageChange)="onPageChange($event)">
      </app-pagination>
    </div>

  </app-list>

</div>
